name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint-backend:
    name: Lint & Type Check Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check backend/app backend/tests

      - name: Type check with Mypy
        run: |
          mypy backend/app backend/tests

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci

      - name: Lint with ESLint
        run: |
          npm run lint

  test-backend:
    name: Test Backend with PostgreSQL
    runs-on: ubuntu-latest
    needs: [lint-backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: halocas_user
          POSTGRES_PASSWORD: halocas_password
          POSTGRES_DB: halocas_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U halocas_user -d halocas_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: testing
      DATABASE_URL: postgresql+asyncpg://halocas_user:halocas_password@localhost:5432/halocas_test_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: halocas_user
      POSTGRES_PASSWORD: halocas_password
      POSTGRES_DB: halocas_test_db
      JWT_SECRET: test_secret_jwt_key_super_safe_and_long_12345
      PYTHONPATH: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run test suite with pytest
        run: |
          pytest --cov=app --cov-report=term-missing

  test-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci

      - name: Build Next.js application
        run: |
          npm run build

      - name: Run frontend tests
        run: |
          npm test

  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deployment webhook..."
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Deployment webhook triggered successfully."
          else
            echo "Warning: RENDER_DEPLOY_HOOK_URL secret is not set. Skipping Render deploy."
          fi
